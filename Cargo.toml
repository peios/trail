[package]
name = "trail"
version = "0.1.0"
edition = "2024"
description = "Static site builder for the Peios learn documentation."

[workspace]
# Keep optional Pagefind server/tokenizer features out of workspace resolution.
exclude = ["vendor/pagefind"]
resolver = "3"

[dependencies]
aho-corasick = "1"
anyhow = "1"
blake3 = "1.8"
axum = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
html-escape = "0.2"
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
imagesize = "0.15.0"
lol_html = "2.9"
minijinja = "2"
notify = "8"
pagefind = { version = "=1.5.2", path = "vendor/pagefind", default-features = false }
pulldown-cmark = "0.13"
pulldown-latex = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
spellbook = "0.4"

[dev-dependencies]
tempfile = "3"
