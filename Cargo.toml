[package]
name = "trail"
version = "0.1.0"
edition = "2024"
description = "Static site builder for the Peios learn documentation."

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
imagesize = "0.15.0"
minijinja = "2"
notify = "8"
pagefind = "1.5.2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
