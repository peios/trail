name: Check

on:
    push:
        branches-ignore: [main]
    pull_request:
    workflow_call:

permissions:
    contents: read

env:
    # The pekit Trail is built with: a commit of github.com/peios/pekit.
    PEKIT_REV: c8fd9a56486fe0968d5a17acb6a24bc8c17972d2

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install pekit and the sandbox it runs steps in
              run: tools/ci-install-pekit
            - name: Install the style and manual tools
              run: sudo apt-get install -y --no-install-recommends groff shellcheck
            - name: Check
              run: tools/check --strict
