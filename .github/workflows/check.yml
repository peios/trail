name: Check

on:
    push:
        branches-ignore: [main]
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.96.0"
                  components: rustfmt
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/trail/bazel-disk
                      ~/.cache/trail/bazel-repository
                      ~/.cache/peios/bazel
                  key: ${{ runner.os }}-trail-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'Cargo.lock') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-trail-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'Cargo.lock') }}-
                      ${{ runner.os }}-trail-bazel-
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - run: sudo apt-get update && sudo apt-get install -y groff shellcheck
            - run: tools/check --disk_cache="$HOME/.cache/trail/bazel-disk" --repository_cache="$HOME/.cache/trail/bazel-repository"
