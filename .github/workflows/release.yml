name: Build and Release

on:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    check:
        uses: ./.github/workflows/check.yml
        permissions:
            contents: read
    build:
        needs: check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/trail/bazel-disk
                      ~/.cache/trail/bazel-repository
                      ~/.cache/peios/bazel
                  key: ${{ runner.os }}-trail-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'Cargo.lock') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-trail-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'Cargo.lock') }}-
                      ${{ runner.os }}-trail-bazel-

            # The binary is consumed by peios/learn's Pages workflow, which runs
            # on the same runner image, so a plain glibc build is enough. A fully
            # static one would require a separately qualified musl toolchain.
            - name: Build
              run: ./tools/bazel build --disk_cache="$HOME/.cache/trail/bazel-disk" --repository_cache="$HOME/.cache/trail/bazel-repository" //:trail

            - name: Stage the artifact
              run: cp bazel-bin/trail trail-linux-amd64

            - name: Update latest release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release delete latest --yes 2>/dev/null || true
                  git tag -f latest
                  git push -f origin latest
                  gh release create latest trail-linux-amd64 \
                    --title "Latest Build" \
                    --notes "Built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d)"
