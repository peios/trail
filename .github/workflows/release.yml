name: Build and Release

on:
    push:
        branches: [main]

permissions:
    contents: write

env:
    # The pekit Trail is built with: a commit of github.com/peios/pekit.
    PEKIT_REV: c8fd9a56486fe0968d5a17acb6a24bc8c17972d2

jobs:
    check:
        uses: ./.github/workflows/check.yml
        permissions:
            contents: read
    build:
        needs: check
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Install pekit and the sandbox it runs steps in
              run: tools/ci-install-pekit

            # The binary is consumed by peios/learn's Pages workflow, which runs
            # on GitHub's Ubuntu image: the `glibc` test, which the check job
            # ran, keeps it to that image's glibc.
            - name: Build
              run: cp "$(tools/pekit-output trail)" trail-linux-amd64

            - name: Update latest release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release delete latest --yes 2>/dev/null || true
                  git tag -f latest
                  git push -f origin latest
                  gh release create latest trail-linux-amd64 \
                    --title "Latest Build" \
                    --notes "Built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d)"
